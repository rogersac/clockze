<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>World Clocks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="content">
      <section class="clocks-section" aria-labelledby="clocks-title">
        <div class="section-heading">
          <div class="section-heading-copy">
            <h2 id="clocks-title">Clocks</h2>
          </div>

          <div class="section-heading-actions">
            <button
              id="add-city-button"
              class="ghost-button icon-button plus-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="add-city-modal"
              aria-expanded="false"
              aria-label="Add a city"
              title="Add a city"
            >
              <span class="plus-icon" aria-hidden="true">+</span>
              <span class="sr-only">Add a city</span>
            </button>

            <button
              id="reorder-button"
              class="ghost-button icon-button"
              type="button"
              aria-label="Reorder clocks"
              aria-pressed="false"
              title="Reorder clocks"
            >
              <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M8 5v12.5M8 5 5.5 7.5M8 5l2.5 2.5M16 19V6.5M16 19l-2.5-2.5M16 19l2.5-2.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span class="sr-only">Reorder clocks</span>
            </button>

            <button
              id="settings-button"
              class="ghost-button icon-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="settings-modal"
              aria-expanded="false"
              aria-label="Settings"
              title="Settings"
            >
              <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
                  fill="currentColor"
                ></path>
              </svg>
              <span class="sr-only">Settings</span>
            </button>

            <button id="reset-button" class="ghost-button icon-button" type="button" aria-label="Reset" title="Reset">
              <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path
                  d="M8 6.5V3.5L3.5 8 8 12.5V9.5h5.25c2.9 0 5.25 2.35 5.25 5.25S16.15 20 13.25 20H8.75"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span class="sr-only">Reset</span>
            </button>
          </div>
        </div>

        <div id="clock-list" class="clock-list"></div>
      </section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop is-hidden"></div>

  <div
    id="add-city-modal"
    class="settings-modal is-hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="search-title"
    aria-hidden="true"
  >
    <div class="settings-dialog search-dialog">
      <div class="settings-dialog-header">
        <h2 id="search-title">Add a city</h2>
        <button id="add-city-close" class="modal-close-button" type="button" aria-label="Close add city dialog">Close</button>
      </div>

      <div class="search-dialog-body">
        <p class="search-dialog-copy">Search after 3 or more characters.</p>

        <div class="search-panel">
          <label class="sr-only" for="city-search">Search for a city</label>
          <input
            id="city-search"
            type="text"
            inputmode="search"
            autocomplete="off"
            placeholder="Search city name"
            aria-describedby="search-status"
          >
          <div id="search-status" class="search-status" aria-live="polite"></div>
          <ul id="search-results" class="search-results" aria-label="Matching cities"></ul>
        </div>
      </div>
    </div>
  </div>

  <div
    id="settings-modal"
    class="settings-modal is-hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
    aria-hidden="true"
  >
    <div class="settings-dialog">
      <div class="settings-dialog-header">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="modal-close-button" type="button" aria-label="Close settings">Close</button>
      </div>

      <div class="settings-list">
        <label class="settings-option" for="setting-24-hour">
          <span>24-hour time</span>
          <input id="setting-24-hour" type="checkbox">
        </label>

        <label class="settings-option" for="setting-seconds">
          <span>Show time with seconds</span>
          <input id="setting-seconds" type="checkbox">
        </label>

        <label class="settings-option" for="setting-weather">
          <span>Show current weather</span>
          <input id="setting-weather" type="checkbox">
        </label>

        <label class="settings-option settings-option-select" for="setting-temperature-unit">
          <span>Temperature unit</span>
          <select id="setting-temperature-unit">
            <option value="fahrenheit">Fahrenheit</option>
            <option value="celsius">Celsius</option>
          </select>
        </label>

        <label class="settings-option" for="setting-date">
          <span>Show date</span>
          <input id="setting-date" type="checkbox">
        </label>

        <label class="settings-option" for="setting-location-meta">
          <span>Show location details</span>
          <input id="setting-location-meta" type="checkbox">
        </label>

        <label class="settings-option" for="setting-time-meta">
          <span>Show time zone details</span>
          <input id="setting-time-meta" type="checkbox">
        </label>
      </div>
    </div>
  </div>

  <template id="clock-row-template">
    <article class="clock-row">
      <button class="swipe-delete-button" type="button" aria-label="Delete clock">
        <span class="trash-icon" aria-hidden="true"></span>
        <span class="sr-only">Delete</span>
      </button>

      <div class="clock-row-inner">
        <div class="clock-col clock-col-location">
          <div class="location-main"></div>
          <div class="location-meta"></div>
        </div>

        <div class="clock-col clock-col-time">
          <div class="time-main"></div>
          <div class="time-meta"></div>
        </div>

        <div class="clock-col clock-col-date">
          <div class="date-main"></div>
        </div>

        <div class="clock-col clock-col-weather weather-slot">
          <div class="weather-primary">
            <span class="weather-icon" aria-hidden="true">?</span>
            <span class="weather-placeholder">--</span>
          </div>
          <div class="weather-meta">Temp / High / Low / Icon</div>
        </div>

        <div class="clock-col clock-col-actions">
          <button class="remove-button" type="button">Remove</button>
          <div class="reorder-controls">
            <button class="reorder-button reorder-up" type="button" aria-label="Move clock up" title="Move up">▲</button>
            <button class="reorder-button reorder-down" type="button" aria-label="Move clock down" title="Move down">▼</button>
          </div>
          <div class="reorder-note" aria-hidden="true">Pinned</div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
