<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>World Clocks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="content">
      <section class="controls" aria-labelledby="search-title">
        <div class="controls-heading">
          <h2 id="search-title">Add a city</h2>
          <p>Search after 3 or more characters.</p>
        </div>

        <div class="search-panel">
          <label class="sr-only" for="city-search">Search for a city</label>
          <input
            id="city-search"
            type="text"
            inputmode="search"
            autocomplete="off"
            placeholder="Search city name"
            aria-describedby="search-status"
          >
          <div id="search-status" class="search-status" aria-live="polite"></div>
          <ul id="search-results" class="search-results" aria-label="Matching cities"></ul>
        </div>
      </section>

      <section class="clocks-section" aria-labelledby="clocks-title">
        <div class="section-heading">
          <div class="section-heading-copy">
            <h2 id="clocks-title">Clocks</h2>
            <p id="location-status" class="muted" aria-live="polite"></p>
          </div>

          <div class="section-heading-actions">
            <button
              id="settings-button"
              class="ghost-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="settings-modal"
              aria-expanded="false"
            >
              Settings
            </button>

            <button id="reset-button" class="ghost-button" type="button">Reset</button>
          </div>
        </div>

        <div id="clock-list" class="clock-list"></div>
      </section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop is-hidden"></div>

  <div
    id="settings-modal"
    class="settings-modal is-hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
    aria-hidden="true"
  >
    <div class="settings-dialog">
      <div class="settings-dialog-header">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="modal-close-button" type="button" aria-label="Close settings">Close</button>
      </div>

      <div class="settings-list">
        <label class="settings-option" for="setting-24-hour">
          <span>24-hour time</span>
          <input id="setting-24-hour" type="checkbox">
        </label>

        <label class="settings-option" for="setting-seconds">
          <span>Show time with seconds</span>
          <input id="setting-seconds" type="checkbox">
        </label>

        <label class="settings-option" for="setting-weather">
          <span>Show current weather</span>
          <input id="setting-weather" type="checkbox">
        </label>
      </div>
    </div>
  </div>

  <template id="clock-row-template">
    <article class="clock-row">
      <button class="swipe-delete-button" type="button" aria-label="Delete clock">
        <span class="trash-icon" aria-hidden="true"></span>
        <span class="sr-only">Delete</span>
      </button>

      <div class="clock-row-inner">
        <div class="clock-col clock-col-location">
          <div class="location-main"></div>
          <div class="location-meta"></div>
        </div>

        <div class="clock-col clock-col-time">
          <div class="time-main"></div>
          <div class="time-meta"></div>
        </div>

        <div class="clock-col clock-col-weather weather-slot">
          <div class="weather-placeholder">--</div>
          <div class="weather-meta">Temp / High / Low / Icon</div>
        </div>

        <div class="clock-col clock-col-actions">
          <button class="remove-button" type="button">Remove</button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
